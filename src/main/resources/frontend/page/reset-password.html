<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link th:href="@{/style/style.css}" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>

<body class="bg-gradient-to-b from-gray-300 to-gray-200 min-h-screen flex items-center justify-center font-mono text-sm">

<div class="w-full max-w-md
            border border-gray-600
            bg-gradient-to-b from-gray-200 to-gray-300
            shadow-[0_10px_30px_rgba(0,0,0,0.5)]">

    <div class="px-4 py-2 border-b border-gray-500
                bg-gradient-to-b from-gray-300 to-gray-400
                tracking-wider text-gray-800 text-center">
        RESET PASSWORD
    </div>

    <div class="p-4 space-y-4 text-gray-800">
        <div id="resetStatus" class="hidden border border-gray-500 bg-gray-100 px-2 py-1 text-xs"></div>

        <div class="grid grid-cols-3 items-center gap-3">
            <span class="text-xs text-gray-700">NEW PASSWORD</span>
            <input id="newPassword"
                   type="password"
                   class="col-span-2 px-2 py-1 border border-gray-500 bg-gray-100 focus:bg-white outline-none">
        </div>

        <div class="flex justify-between items-center pt-2">
            <a th:href="@{/login}" class="text-xs text-gray-600 hover:text-gray-900">
                LOGIN
            </a>

            <button type="button"
                    onclick="confirmReset()"
                    class="px-3 py-1 border border-gray-700
                           bg-gradient-to-b from-gray-500 to-gray-700
                           text-white hover:from-gray-600 hover:to-gray-800">
                SAVE
            </button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let CONTEXT_PATH = /*[[@{/}]]*/ '/';
    CONTEXT_PATH = CONTEXT_PATH.replace(/\/$/, '');
</script>
<script th:if="${scriptBundle != null}" th:src="${scriptBundle}"></script>
</body>
</html>
