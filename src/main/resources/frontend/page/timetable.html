<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Time Registry</title>
    <link th:href="@{/style/style.css}" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <style>
        .time-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }

        .time-gap-panel {
            margin-bottom: 1rem;
            border: 1px solid #6b7280;
            background: #f3f4f6;
        }

        .time-gap-header {
            display: grid;
            grid-template-columns: 1fr 7rem 8rem 7rem;
            gap: 0.5rem;
            border-bottom: 1px solid #6b7280;
            background: linear-gradient(to right, #e5e7eb, #d1d5db);
            color: #374151;
            font-size: 0.75rem;
            line-height: 1rem;
            padding: 0.5rem 0.75rem;
        }

        .time-gap-graph {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
            padding: 0.75rem;
        }

        .time-gap-example {
            border: 1px solid #6b7280;
            background: #f9fafb;
            min-width: 0;
        }

        .time-gap-example-wide {
            grid-column: 1 / -1;
        }

        .time-gap-example-title {
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
            border-bottom: 1px solid #9ca3af;
            background: #e5e7eb;
            color: #1f2937;
            font-size: 0.75rem;
            line-height: 1rem;
            padding: 0.45rem 0.6rem;
        }

        .time-gap-example-body {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.6rem;
        }

        .week-bar-row {
            display: grid;
            grid-template-columns: minmax(7rem, 10rem) minmax(8rem, 1fr) 4.5rem;
            align-items: center;
            gap: 0.5rem;
            color: #1f2937;
            font-size: 0.75rem;
            line-height: 1rem;
        }

        .week-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .week-track {
            height: 1.25rem;
            border: 1px solid #6b7280;
            background: #e5e7eb;
        }

        .week-bar {
            height: 100%;
            background: linear-gradient(to right, #3b82f6, #1d4ed8);
        }

        .week-value {
            text-align: right;
        }

        .week-stacked-track {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 2px;
            min-height: 1.25rem;
        }

        .week-stacked-day {
            border: 1px solid #9ca3af;
            background: #d1d5db;
            min-width: 0;
        }

        .week-heatmap {
            display: grid;
            grid-template-columns: 4rem repeat(7, minmax(1.5rem, 1fr)) 4.5rem;
            align-items: center;
            gap: 0.25rem;
            color: #1f2937;
            font-size: 0.75rem;
            line-height: 1rem;
        }

        .week-heat-cell {
            height: 1.5rem;
            border: 1px solid #9ca3af;
            background: #e5e7eb;
        }

        .week-rank-row {
            display: grid;
            grid-template-columns: 2rem minmax(7rem, 1fr) 4.5rem;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid #d1d5db;
            color: #1f2937;
            font-size: 0.75rem;
            line-height: 1rem;
            padding-bottom: 0.35rem;
        }

        .week-rank-number {
            background: #374151;
            color: white;
            padding: 0.15rem 0;
            text-align: center;
        }

        .week-timeline {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0.35rem;
        }

        .week-timeline-day {
            min-height: 4.5rem;
            border: 1px solid #9ca3af;
            background: #e5e7eb;
            position: relative;
        }

        .week-timeline-fill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, #3b82f6, #93c5fd);
        }

        .week-timeline-label {
            position: relative;
            z-index: 1;
            padding: 0.25rem;
            color: #1f2937;
            font-size: 0.7rem;
            line-height: 0.9rem;
        }

        .time-gap-empty {
            grid-column: 1 / -1;
            padding: 2rem 0.75rem;
            text-align: center;
            color: #4b5563;
            font-size: 0.75rem;
            line-height: 1rem;
        }

        @media (max-width: 760px) {
            .time-gap-header {
                grid-template-columns: 1fr;
            }

            .time-gap-graph {
                grid-template-columns: 1fr;
            }

            .time-gap-header div {
                text-align: left;
            }

            .time-gap-example-wide {
                grid-column: auto;
            }

            .week-bar-row {
                grid-template-columns: 1fr 4.5rem;
            }

            .week-label {
                grid-column: 1 / -1;
            }

            .week-heatmap {
                grid-template-columns: 3rem repeat(7, minmax(1rem, 1fr));
            }

            .week-heatmap .week-value {
                grid-column: 1 / -1;
                text-align: left;
            }
        }
    </style>
</head>

<body class="bg-gradient-to-b from-gray-300 to-gray-200 min-h-screen font-mono text-sm">

<header class="bg-gradient-to-b from-gray-200 to-gray-400 border-b border-gray-500 shadow-inner">
    <div class="max-w-6xl mx-auto px-6 py-3 flex justify-between items-center">

        <a th:href="${#authorization.expression('hasRole(''ADMIN'')')} ? @{/time} : @{/}" class="text-gray-800 tracking-wider font-semibold">
            TIME ENTRIES
        </a>

        <div class="relative">
            <div id="headerIcon"
                 class="w-9 h-9 bg-gray-700 text-white flex items-center justify-center border border-black cursor-pointer"
                 onclick="toggleUserMenu()">...
            </div>

            <div id="userDropdown"
                 class="hidden absolute right-0 top-full mt-2 w-48
              bg-gray-200 border border-gray-600 shadow-lg z-50">

                <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                        th:onclick="|window.location.href='@{/logout}'|">
                    Logout
                </button>

                <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                        onclick="openPasswordModal(); toggleUserMenu()">
                    Change Password
                </button>

                <div th:if="${!#authorization.expression('hasRole(''ADMIN'')')}">
                    <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                            th:onclick="|window.location.href='@{/timetable(id=${#authentication.principal.id})}'|">
                        Time Registry
                    </button>
                </div>

                <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                    <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                            th:onclick="|window.location.href='@{/setup}'|">
                        Setup
                    </button>

                    <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                            th:onclick="|window.location.href='@{/time}'|">
                        Time Registry
                    </button>
                </div>

            </div>
        </div>

    </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-4">

    <div class="time-filter-row">
        <select id="projectFilter"
                class="w-56 border border-gray-500 bg-gray-100 px-2 py-1 text-xs"
                onchange="selectedProject = this.value; renderEntries()">
            <option value="all">ALL PROJECTS</option>
        </select>

        <select id="gapMinimumFilter"
                class="border border-gray-500 bg-gray-100 px-2 py-1 text-xs"
                onchange="minimumGapMinutes = Number(this.value); renderEntries()">
            <option value="0">ALL GAPS</option>
            <option value="15">15+ MIN</option>
            <option value="30" selected>30+ MIN</option>
            <option value="60">1+ HOUR</option>
            <option value="240">4+ HOURS</option>
        </select>
    </div>

    <section class="time-gap-panel">
        <div class="time-gap-header">
            <div>WEEKLY TIME GAP EXAMPLES</div>
            <div id="gapCount" class="text-right">0 WEEKS</div>
            <div id="gapTotal" class="text-right">0H TOTAL</div>
            <div id="gapMax" class="text-right">0H MAX</div>
        </div>
        <div id="gapGraph" class="time-gap-graph"></div>
    </section>

    <div class="grid grid-cols-12 text-xs text-gray-700 mb-2 px-3">
        <div class="col-span-3">PROJECT</div>
        <div class="col-span-3">TASK</div>
        <div class="col-span-2">START</div>
        <div class="col-span-2">END</div>
        <div class="col-span-2"></div>
    </div>

    <div id="userList" class="flex flex-col gap-2"></div>

</main>


<script th:inline="javascript">
    let CONTEXT_PATH = /*[[@{/}]]*/ '/';
    CONTEXT_PATH = CONTEXT_PATH.replace(/\/$/, '');
    window.__BOOTSTRAP__ = {
        currentUser: JSON.parse(/*[[${currentUserJson}]]*/ 'null'),
        isAdmin: [[${#authorization.expression('hasRole(''ADMIN'')')}]]
    };
</script>
<script th:if="${scriptBundle != null}" th:src="${scriptBundle}"></script>
</body>
</html>
