<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Time Registry</title>
    <link th:href="@{/style/style.css}" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <style>
        .time-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }

        .time-gap-panel {
            margin-bottom: 1rem;
            border: 1px solid #6b7280;
            background: #f3f4f6;
        }

        .time-gap-header {
            display: grid;
            grid-template-columns: 1fr 7rem 8rem 7rem;
            gap: 0.5rem;
            border-bottom: 1px solid #6b7280;
            background: linear-gradient(to right, #e5e7eb, #d1d5db);
            color: #374151;
            font-size: 0.75rem;
            line-height: 1rem;
            padding: 0.5rem 0.75rem;
        }

        .time-gap-graph {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.75rem;
        }

        .weekly-gap-summary {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            background: #e5e7eb;
            border: 1px solid #9ca3af;
            color: #1f2937;
            font-size: 0.75rem;
            line-height: 1rem;
            padding: 0.5rem 0.75rem;
        }

        .weekly-day-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0.5rem;
        }

        .weekly-day-button {
            min-height: 8rem;
            border: 1px solid #6b7280;
            background: #e5e7eb;
            color: #1f2937;
            position: relative;
            text-align: left;
            padding: 0.45rem;
            overflow: hidden;
        }

        .weekly-day-button:hover,
        .weekly-day-button.weekly-day-selected {
            background: #dbeafe;
            border-color: #1d4ed8;
        }

        .weekly-day-fill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, #3b82f6, #93c5fd);
        }

        .weekly-day-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .weekly-day-name {
            font-weight: 600;
            color: #111827;
        }

        .weekly-day-total {
            font-size: 0.85rem;
            color: #111827;
        }

        .weekly-day-count {
            color: #374151;
        }

        .weekly-gap-detail {
            border: 1px solid #6b7280;
            background: #f9fafb;
        }

        .weekly-gap-detail-header {
            display: grid;
            grid-template-columns: 1fr 7rem 6rem;
            gap: 0.5rem;
            border-bottom: 1px solid #9ca3af;
            background: #e5e7eb;
            color: #374151;
            font-size: 0.75rem;
            line-height: 1rem;
            padding: 0.5rem 0.75rem;
        }

        .weekly-gap-row {
            display: grid;
            grid-template-columns: 1fr 7rem 6rem;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid #d1d5db;
            color: #1f2937;
            font-size: 0.75rem;
            line-height: 1rem;
            padding: 0.5rem 0.75rem;
        }

        .weekly-gap-row:last-child {
            border-bottom: 0;
        }

        .weekly-gap-range {
            color: #111827;
        }

        .weekly-gap-muted {
            color: #4b5563;
        }

        .weekly-gap-right {
            text-align: right;
        }

        .weekly-gap-empty-detail {
            padding: 1rem 0.75rem;
            color: #4b5563;
            font-size: 0.75rem;
            line-height: 1rem;
            text-align: center;
        }

        .time-gap-empty {
            grid-column: 1 / -1;
            padding: 2rem 0.75rem;
            text-align: center;
            color: #4b5563;
            font-size: 0.75rem;
            line-height: 1rem;
        }

        @media (max-width: 760px) {
            .time-gap-header {
                grid-template-columns: 1fr;
            }

            .time-gap-graph {
                grid-template-columns: 1fr;
            }

            .time-gap-header div {
                text-align: left;
            }

            .weekly-day-grid {
                grid-template-columns: 1fr;
            }

            .weekly-day-button {
                min-height: 5.75rem;
            }

            .weekly-gap-detail-header,
            .weekly-gap-row {
                grid-template-columns: 1fr;
            }

            .weekly-gap-right {
                text-align: left;
            }
        }
    </style>
</head>

<body class="bg-gradient-to-b from-gray-300 to-gray-200 min-h-screen font-mono text-sm">

<header class="bg-gradient-to-b from-gray-200 to-gray-400 border-b border-gray-500 shadow-inner">
    <div class="max-w-6xl mx-auto px-6 py-3 flex justify-between items-center">

        <a th:href="${#authorization.expression('hasRole(''ADMIN'')')} ? @{/time} : @{/}" class="text-gray-800 tracking-wider font-semibold">
            TIME ENTRIES
        </a>

        <div class="relative">
            <div id="headerIcon"
                 class="w-9 h-9 bg-gray-700 text-white flex items-center justify-center border border-black cursor-pointer"
                 onclick="toggleUserMenu()">...
            </div>

            <div id="userDropdown"
                 class="hidden absolute right-0 top-full mt-2 w-48
              bg-gray-200 border border-gray-600 shadow-lg z-50">

                <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                        th:onclick="|window.location.href='@{/logout}'|">
                    Logout
                </button>

                <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                        onclick="openPasswordModal(); toggleUserMenu()">
                    Change Password
                </button>

                <div th:if="${!#authorization.expression('hasRole(''ADMIN'')')}">
                    <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                            th:onclick="|window.location.href='@{/timetable(id=${#authentication.principal.id})}'|">
                        Time Registry
                    </button>
                </div>

                <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                    <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                            th:onclick="|window.location.href='@{/setup}'|">
                        Setup
                    </button>

                    <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                            th:onclick="|window.location.href='@{/time}'|">
                        Time Registry
                    </button>
                </div>

            </div>
        </div>

    </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-4">

    <div class="time-filter-row">
        <select id="projectFilter"
                class="w-56 border border-gray-500 bg-gray-100 px-2 py-1 text-xs"
                onchange="selectedProject = this.value; renderEntries()">
            <option value="all">ALL PROJECTS</option>
        </select>

        <select id="weekFilter"
                class="border border-gray-500 bg-gray-100 px-2 py-1 text-xs"
                onchange="selectedWeekStartKey = this.value; selectedGapDayIndex = null; renderEntries()">
        </select>
    </div>

    <section class="time-gap-panel">
        <div class="time-gap-header">
            <div id="gapWeekTitle">WEEKLY TIME GAP GRAPH</div>
            <div id="gapCount" class="text-right">0 GAPS</div>
            <div id="gapTotal" class="text-right">0H TOTAL</div>
            <div id="gapMax" class="text-right">0H MAX GAP</div>
        </div>
        <div id="gapGraph" class="time-gap-graph"></div>
    </section>

    <div class="grid grid-cols-12 text-xs text-gray-700 mb-2 px-3">
        <div class="col-span-3">PROJECT</div>
        <div class="col-span-3">TASK</div>
        <div class="col-span-2">START</div>
        <div class="col-span-2">END</div>
        <div class="col-span-2"></div>
    </div>

    <div id="userList" class="flex flex-col gap-2"></div>

</main>


<script th:inline="javascript">
    let CONTEXT_PATH = /*[[@{/}]]*/ '/';
    CONTEXT_PATH = CONTEXT_PATH.replace(/\/$/, '');
    window.__BOOTSTRAP__ = {
        currentUser: JSON.parse(/*[[${currentUserJson}]]*/ 'null'),
        isAdmin: [[${#authorization.expression('hasRole(''ADMIN'')')}]]
    };
</script>
<script th:if="${scriptBundle != null}" th:src="${scriptBundle}"></script>
</body>
</html>
