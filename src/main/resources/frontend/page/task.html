<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tasks</title>
  <link th:href="@{/style/style.css}" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

  <style>
    .dragging {
      opacity: 0.4;
    }

    .drag-over {
      margin-top: 12px;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-gray-300 to-gray-200 min-h-screen font-mono text-sm">

<!-- TOP BAR -->
<header class="bg-gradient-to-b from-gray-200 to-gray-400 border-b border-gray-500 shadow-inner">
  <div class="max-w-6xl mx-auto px-6 py-3 flex justify-between items-center">

    <a th:href="@{/}" id="title-header">
      <h1 class="tracking-wider text-gray-800 font-semibold">
        TASK CONTROL
      </h1>
    </a>

    <div class="flex items-center gap-4">

      <button onclick="openCreateModal()"
              class="px-3 py-1 border border-gray-600
                     bg-gradient-to-b from-gray-300 to-gray-500
                     hover:from-gray-400 hover:to-gray-600">
        + NEW TASK
      </button>

      <div class="relative">

        <!-- ICON -->
        <div id="headerIcon"
             class="w-9 h-9 bg-gray-700 text-white select-none
              flex items-center justify-center
              border border-black cursor-pointer"
             onclick="toggleUserMenu()">
          ...
        </div>

        <!-- DROPDOWN -->
        <div id="userDropdown"
             class="hidden absolute right-0 top-full mt-2 w-48
              bg-gray-200 border border-gray-600 shadow-lg z-50">

          <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                  th:onclick="|window.location.href='@{/logout}'|">
            Logout
          </button>

          <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                  th:onclick="|window.location.href='@{/settings}'|">
            Settings
          </button>

          <div th:if="${!#authorization.expression('hasRole(''ADMIN'')')}">
            <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                    th:onclick="|window.location.href='@{/timetable(id=${#authentication.principal.id})}'|">
              Time Entries
            </button>
          </div>

          <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                    th:onclick="|window.location.href='@{/setup}'|">
              User Control
            </button>

            <button class="w-full text-left px-3 py-2 hover:bg-gray-300"
                    th:onclick="|window.location.href='@{/time}'|">
              Time Control
            </button>
          </div>

        </div>

      </div>

    </div>
  </div>
</header>

<!-- CONTENT -->
<main class="max-w-6xl mx-auto px-6 py-4">

  <!-- PROJECT HEADER -->
  <div class="flex justify-between items-center mb-3">

    <h2 id="title"
        class="text-gray-800 tracking-wide">
      LOADING...
    </h2>

    <div class="flex gap-2">
      <button id="archive-btn"
              class="px-3 py-1 border border-gray-700
             bg-gradient-to-b from-yellow-500 to-yellow-700
             text-white hover:from-yellow-600 hover:to-yellow-800"
              th:attr="onclick=|(async () => {
              await archiveProject();
              window.location.replace('@{/}');
              })()|">
        ARCHIVE
      </button>

      <button
              class="px-3 py-1 border border-gray-700
             bg-gradient-to-b from-blue-500 to-blue-700
             text-white hover:from-blue-600 hover:to-blue-800"
             onclick="openRenameModal()">
        RENAME
      </button>

      <button
              class="px-3 py-1 border border-gray-700
             bg-gradient-to-b from-red-500 to-red-700
             text-white hover:from-red-600 hover:to-red-800"
              th:attr="onclick=|(async () => {
        const confirmDelete = confirm('Delete project?');
        if (!confirmDelete) return;
        await deleteProject();
        window.location.replace('@{/}');
      })()|">
        DELETE
      </button>
    </div>
  </div>

  <!-- COLUMN LABELS -->
  <div class="grid grid-cols-12 text-xs text-gray-700 mb-2 px-2 pl-0">
    <div class="col-span-5">TASK</div>
    <div class="col-span-3">ASSIGNED</div>
    <div class="col-span-3">ACTIVE</div>
    <div class="col-span-1"></div>
  </div>

  <!-- TASK LIST -->
  <div id="tasks" class="flex flex-col gap-1"></div>

  <div class="flex items-center gap-4 my-6 text-gray-400" id="tasks-finished-header">
    <div class="flex-1 h-px bg-gray-400"></div>

    <h1 class="text-sm font-medium uppercase tracking-wide">
      Finished
    </h1>
    <div class="flex-1 h-px bg-gray-400"></div>
  </div>
  <div id="tasks-finished" class="flex flex-col gap-1"></div>

  <div class="flex items-center gap-4 my-6 text-gray-400" id="tasks-closed-header">
    <div class="flex-1 h-px bg-gray-400"></div>

    <h1 class="text-sm font-medium uppercase tracking-wide">
      Closed
    </h1>
    <div class="flex-1 h-px bg-gray-400"></div>
  </div>
  <div id="tasks-closed" class="flex flex-col gap-1"></div>
</main>

<!-- MODAL -->
<div id="popupHolder"></div>

<!-- JS -->
<script th:inline="javascript">
  let CONTEXT_PATH = /*[[@{/}]]*/ '/';
  CONTEXT_PATH = CONTEXT_PATH.replace(/\/$/, '');
  window.__BOOTSTRAP__ = {
    currentUser: JSON.parse(/*[[${currentUserJson}]]*/ 'null')
  };
</script>

<script th:if="${scriptBundle != null}" th:src="${scriptBundle}"></script>
</body>
</html>
